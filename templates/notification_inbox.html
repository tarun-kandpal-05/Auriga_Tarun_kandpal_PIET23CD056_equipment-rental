{% extends 'base.html' %}{% block title %}Notification inbox | AV Room Desk{% endblock %}{% block content %}<h1>Notification inbox</h1><div class="card"><div class="list-group list-group-flush">{% for item in notifications %}<div class="list-group-item"><b>{{ item.borrower_name }}</b><br>{{ item.message }}<small class="text-muted d-block">{{ item.created_at }}</small></div>{% else %}<div class="list-group-item text-muted">No reminders have been sent.</div>{% endfor %}</div></div>{% endblock %}
