{% extends 'base.html' %}{% block title %}Borrow | AV Room Desk{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><h1>Borrow equipment</h1><p class="text-muted">Maximum {{ max_active_items }} active units per borrower. A deposit is recorded per unit.</p><form method="post" class="card card-body"><h5 class="mb-3">Borrower</h5><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input name="name" class="form-control" required></div><div class="col-md-6"><label class="form-label">Student or club ID</label><input name="student_id" class="form-control" required></div><div class="col-12"><label class="form-label">Contact</label><input name="contact" class="form-control"></div><div class="col-md-6"><label class="form-label">Equipment type</label><select name="equipment_type_id" class="form-select" required><option value="">Choose...</option>{% for item in types %}<option value="{{ item.id }}">{{ item.name }} · ₹{{ item.deposit_amount|int }} deposit</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Quantity</label><input name="quantity" type="number" min="1" max="{{ max_active_items }}" value="1" class="form-control" required></div><div class="col-md-3"><label class="form-label">Due date</label><input name="due_date" type="date" min="{{ today.isoformat() }}" value="{{ default_due }}" class="form-control" required></div></div><button class="btn btn-primary mt-4">Confirm borrow</button></form></div></div>{% endblock %}
