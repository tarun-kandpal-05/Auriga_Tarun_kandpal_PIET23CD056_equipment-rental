<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>try { if (localStorage.getItem('av-room-theme') === 'dark') document.documentElement.classList.add('theme-dark'); } catch (error) {}</script><title>{% block title %}AV Room Desk{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">AV Room Desk</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto"><a class="nav-link" href="{{ url_for('equipment') }}">Equipment</a><a class="nav-link" href="{{ url_for('borrow') }}">Borrow</a><a class="nav-link" href="{{ url_for('rentals') }}">Rentals</a><a class="nav-link" href="{{ url_for('reservations') }}">Reservations</a><a class="nav-link" href="{{ url_for('availability') }}">Availability</a><a class="nav-link" href="{{ url_for('notifications') }}">Reminders</a><button type="button" class="btn btn-sm btn-outline-light theme-toggle ms-lg-2" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode"><span id="theme-icon" aria-hidden="true">☾</span> <span id="theme-label">Dark mode</span></button></div></div></div></nav><main class="container py-4 page-content">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
